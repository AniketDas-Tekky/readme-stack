name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run action
        id: action
        uses: ./
        with:
          readme-path: README.md
      - run: echo "Result: ${{ steps.action.outputs.result }}"
