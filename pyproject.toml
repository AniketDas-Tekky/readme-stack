[project]
name = "readme-stack"
version = "0.1.0"
description = "GitHub Action that runs a Python script."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
readme-stack = "readme_stack.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
