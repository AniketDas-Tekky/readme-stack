[project]
name = "readme-stack"
version = "0.1.0"
description = "CLI that uses an LLM agent to generate or update a repository README."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ai[anthropic,openai]==0.7.0", "pydantic>=2.13"]

[project.scripts]
readme-stack = "readme_stack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = ["plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
